[project]
name = "qdrant-full-mcp"
version = "0.4.0"
description = "MCP server for Qdrant: Qdrant Cloud account management (clusters, backups, API keys) plus data-plane tools (collections, points, hybrid search) and plain-text memory with local embeddings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "qdrant", "qdrant-cloud", "vector-database", "claude"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = ["mcp>=1.8,<2", "httpx>=0.27", "fastembed>=0.3"]

[project.optional-dependencies]
embed = []  # kept so "qdrant-full-mcp[embed]" installs still work; FastEmbed is now a core dependency
dev = ["pytest>=8"]

[project.scripts]
qdrant-full-mcp = "qdrant_full_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_full_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
