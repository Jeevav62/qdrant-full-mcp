[project]
name = "qdrant-full-mcp"
version = "0.4.1"
description = "The complete Qdrant MCP server: manage Qdrant Cloud (clusters, backups, API keys) and your vector data (collections, hybrid search, text memory) from Claude Code, Codex, Cursor or any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "mcp-server", "model-context-protocol", "qdrant", "qdrant-cloud", "vector-database", "rag", "hybrid-search", "semantic-search", "embeddings", "fastembed", "claude", "claude-code", "codex", "cursor", "ai-agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=1.8,<2", "httpx>=0.27", "fastembed>=0.3", "qdrant-client>=1.12"]

[project.urls]
Homepage = "https://github.com/Jeevav62/qdrant-full-mcp"
Repository = "https://github.com/Jeevav62/qdrant-full-mcp"
Issues = "https://github.com/Jeevav62/qdrant-full-mcp/issues"

[project.optional-dependencies]
embed = []  # kept so "qdrant-full-mcp[embed]" installs still work; FastEmbed is now a core dependency
dev = ["pytest>=8"]

[project.scripts]
qdrant-full-mcp = "qdrant_full_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_full_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]
